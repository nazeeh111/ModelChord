[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "modelchord"
version = "0.2.0"
description = "Compose compatible specialists with measured capability floors and bounded deficit-directed repair"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Nazeeh"}]
dependencies = ["torch==2.9.1", "numpy==2.2.6", "safetensors==0.6.2", "packaging==26.3"]

[project.optional-dependencies]
study = ["scikit-learn==1.7.2", "scipy==1.16.3"]
dev = ["pytest==8.4.2", "build==1.3.0"]

[project.scripts]
modelchord = "modelchord.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelchord = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
