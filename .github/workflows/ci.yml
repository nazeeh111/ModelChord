name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime and package
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[study,dev]'
      - name: Correctness and failure gates
        run: python -m pytest -q tests experiments/v02/test_search.py
      - name: Package
        run: python -m build
      - name: Independent application smoke
        run: python scripts/ci_smoke.py
